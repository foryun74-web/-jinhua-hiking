<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#184d36"><title>주말 산행 공지 작성</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f3;color:#173e2d;font:17px/1.5 system-ui,sans-serif}
header{background:#184d36;color:white;padding:23px 18px}h1{font-size:23px;margin:0}
main{max-width:680px;margin:auto;padding:18px}a{color:#176a46}
.card{background:white;border-radius:18px;padding:20px;margin:18px 0;box-shadow:0 3px 15px #14342112}
label{display:block;font-weight:750;margin:15px 0 6px}
input,select{width:100%;padding:14px;border:1px solid #cbd8cf;border-radius:10px;font:inherit;min-width:0}
button{width:100%;background:#184d36;color:white;border:0;border-radius:11px;padding:15px;font:inherit;font-weight:750;cursor:pointer;margin-top:14px}
button.secondary{background:#e6f0e9;color:#184d36}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.links{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.links a{background:#e6f0e9;border-radius:9px;padding:12px;text-decoration:none;flex:1;text-align:center;font-weight:700}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font:15px/1.7 system-ui,sans-serif;color:#222;margin:0}
.muted{font-size:14px;color:#637569}.notice{padding:12px;background:#edf5ef;border-radius:10px}
@media(max-width:440px){.row{grid-template-columns:1fr}}
</style></head>
<body><header><h1>주말 산행 공지 작성</h1><div>진짜 산에 가는 사람들</div></header>
<main><p><a href="./">← 등산코스 130선으로 돌아가기</a></p>
<section class="card">
<label for="place">산행장소 (중국어)</label>
<input id="place" value="五泄风景区" placeholder="예: 东白山 / 五泄风景区" autocomplete="off">
<button id="search" type="button">🔎 산행장소 검색 완료 · 자동 입력</button>
<p id="searchStatus" class="muted" aria-live="polite">장소명을 입력하고 버튼을 누르면 지도 검색 링크와 이번 주말 일정이 자동으로 채워집니다.</p>
<label for="ko">한국어 이름 (선택)</label><input id="ko" value="우시에 풍경구">
<div class="row">
<div><label for="date">산행 날짜</label><input id="date" type="date"></div>
<div><label for="deadline">참석 확인 마감일</label><input id="deadline" type="date"></div>
</div><div class="row">
<div><label for="time">집합시간</label><input id="time" type="time" value="11:30"></div>
<div><label for="count">참가자 명단 칸 수</label><select id="count"><option>5</option><option>6</option><option>8</option><option>10</option><option>15</option></select></div>
</div>
<label for="meeting">집합장소</label><input id="meeting" value="첸청 68동">
<div class="notice"><strong>자동 입력된 산행 목적지 지도</strong>
<div class="links"><a id="amap" target="_blank" rel="noopener noreferrer">📍 고덕지도</a><a id="baidu" target="_blank" rel="noopener noreferrer">📍 바이두지도</a></div>
<p class="muted">공지에는 긴 지도 주소 대신 지도 이름만 표시됩니다. 위챗의 실제 위치 카드 전송은 위챗 앱에서 별도로 해야 합니다. 검색 결과에서 정확한 입구를 확인하세요.</p></div>
</section>
<section class="card" id="result"><h2>위챗 공지 미리보기</h2><pre id="preview"></pre>
<button id="copy" type="button">공지 전체 복사</button>
<p class="muted" id="status" aria-live="polite">복사 후 위챗 공지방에 붙여넣으세요. 지도 URL은 표시되지 않습니다.</p></section>
</main>
<script>
const ids=['place','ko','date','deadline','time','count','meeting'];
const el=id=>document.getElementById(id);
const known={'五泄风景区':'우시에 풍경구','诸暨五泄风景区':'우시에 풍경구','东白山':'동바이산','德胜岩':'더성옌','仙华山':'셴화산','牛头山':'뉴터우산'};
const fmtDate=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
function nextSaturday(){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+(6-d.getDay()+7)%7);return d;}
function day(v){if(!v)return '미정';const d=new Date(v+'T12:00:00');return `${d.getMonth()+1}월 ${d.getDate()}일(${['일','월','화','수','목','금','토'][d.getDay()]})`;}
function links(p){const q=encodeURIComponent(p.trim());return {
a:'https://uri.amap.com/search?keyword='+q+'&callnative=1',
b:'https://map.baidu.com/?newmap=1&ie=utf-8&s=s%26wd%3D'+q
};}
function update(){
 const p=el('place').value.trim();const {a,b}=links(p);
 el('amap').href=p?a:'#';el('baidu').href=p?b:'#';
 const t=el('time').value.split(':');
 const tim=t.length===2?`${Number(t[0])<12?'오전':'오후'} ${Number(t[0])%12||12}시 ${t[1]}분`:'미정';
 const n=Math.min(30,Math.max(1,Number(el('count').value)||5));
 const title=p+(el('ko').value.trim()?` (${el('ko').value.trim()})`:'');
 const msg=`⛰️ 진짜 산에 가는 사람들 ⛰️

📢 ${day(el('date').value)} 주말 산행 공지

산행일자: ${day(el('date').value)}
산행장소: ${title}
집합시간: ${tim}
집합장소: ${el('meeting').value}

🗺️ 산행 목적지 지도 안내

📍 고덕지도  |  📍 바이두지도
(위챗에서 위치정보 카드로 별도 공유)

🌿 이번 주말에도 함께 산에 오르며 건강도 챙기고 즐거운 시간 보내요!

📌 산행 참가 신청

${day(el('deadline').value)}까지 참석 여부를 알려주세요.

🙋 참가자 명단

${Array.from({length:n},(_,i)=>i+1+'.').join('\n')}

함께 걷는 즐거움, 함께하는 건강!`;
 el('preview').textContent=msg;
 try{localStorage.setItem('hikingNoticeDraft',JSON.stringify(Object.fromEntries(ids.map(id=>[id,el(id).value]))));}catch(e){}
}
function autofill(){
 const p=el('place').value.trim();
 if(!p){el('searchStatus').textContent='먼저 중국어 산행장소를 입력해 주세요.';el('place').focus();return;}
 el('ko').value=known[p]||'';
 const sat=nextSaturday(),fri=new Date(sat);fri.setDate(sat.getDate()-1);
 el('date').value=fmtDate(sat);el('deadline').value=fmtDate(fri);
 el('time').value='11:30';el('count').value='5';
 if(!el('meeting').value.trim())el('meeting').value='첸청 68동';
 update();
 el('searchStatus').textContent=`${p} 검색 링크와 산행 일정이 입력되었습니다. 지도 버튼에서 실제 위치를 확인해 주세요.`;
 el('result').scrollIntoView({behavior:'smooth',block:'start'});
}
try{const saved=JSON.parse(localStorage.getItem('hikingNoticeDraft')||'null');if(saved)ids.forEach(id=>{if(saved[id]!=null)el(id).value=saved[id];});}catch(e){}
if(!el('date').value){const d=nextSaturday();el('date').value=fmtDate(d);const f=new Date(d);f.setDate(f.getDate()-1);el('deadline').value=fmtDate(f);}
ids.forEach(id=>el(id).addEventListener('input',update));
el('search').addEventListener('click',autofill);
el('copy').onclick=async()=>{
 try{await navigator.clipboard.writeText(el('preview').textContent);el('status').textContent='복사했습니다. 위챗에 붙여넣으세요.';}
 catch(e){const ta=document.createElement('textarea');ta.value=el('preview').textContent;document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();el('status').textContent=ok?'복사했습니다.':'복사할 수 없습니다. 공지 내용을 길게 눌러 복사하세요.';}
};
update();
</script></body></html>
